services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: secondbrain
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondbrain"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${VAULT_HOST_PATH:-/Users/vamshipokala/Documents/Second-Brain}:/vault
      - hf_cache:/root/.cache/huggingface
    environment:
      VAULT_PATH: /vault
      DATABASE_URL: postgresql+asyncpg://secondbrain:${POSTGRES_PASSWORD:-localdev}@postgres:5432/secondbrain
      VECTOR_BACKEND: ${VECTOR_BACKEND:-pgvector}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      MAX_INGEST_WORKERS: ${MAX_INGEST_WORKERS:-2}
      WATCHER_DEBOUNCE_MS: ${WATCHER_DEBOUNCE_MS:-5000}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-llama3.1:8b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      DOC_API_KEYS: ${DOC_API_KEYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11435:11434"
    restart: unless-stopped

volumes:
  pgdata:
  ollama_models:
  hf_cache:
