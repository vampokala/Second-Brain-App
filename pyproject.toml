[project]
name = "second-brain-app"
version = "0.1.0"
description = "Personal knowledge base with RAG, ingest, and chat (forked from Doc-Ingestion)"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "W", "I",
  "B", "SIM", "UP", "S", "RUF",
  "C90", "PLR0912", "PLR0915",
]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
  "*/tests/*",
  "*/migrations/*",
  "*/__main__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"
