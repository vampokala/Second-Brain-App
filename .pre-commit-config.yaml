# Auto-generated by engineering-standards bootstrap.sh
# Stacks: python,typescript
default_install_hook_types: [pre-commit, pre-push, commit-msg]
repos:
# Universal pre-commit hooks (apply to all stacks).
# Combine with one or more of: python.yaml, typescript.yaml, jvm.yaml.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package-lock.json|pnpm-lock.yaml|poetry.lock|gradle.lockfile

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["--strict", "feat", "fix", "chore", "docs", "test", "refactor", "perf", "ci", "build"]

  # Diff coverage gate (cross-stack). Runs only if a coverage.xml/cobertura/jacoco file exists.
  - repo: local
    hooks:
      - id: diff-coverage
        name: diff-cover (>= 80% on changed lines)
        entry: bash -c 'COV=$(ls coverage.xml coverage/cobertura-coverage.xml build/reports/jacoco/test/jacocoTestReport.xml target/site/jacoco/jacoco.xml 2>/dev/null | head -1); [ -z "$COV" ] && exit 0; diff-cover "$COV" --compare-branch=origin/main --fail-under=80'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: jscpd-duplication
        name: jscpd (duplication <= 3%)
        entry: bash -c 'command -v npx >/dev/null && npx -y jscpd@4 --threshold 3 --silent --gitignore . || exit 0'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: semgrep-security
        name: semgrep (security audit)
        entry: bash -c 'command -v semgrep >/dev/null && semgrep --config=p/security-audit --config=p/secrets --error --quiet . || exit 0'
        language: system
        pass_filenames: false
        stages: [pre-push]
# Python pre-commit bundle. Append to common.yaml's repos: list.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: ["--strict", "--ignore-missing-imports"]
        additional_dependencies: ["pydantic>=2.0", "types-requests", "types-PyYAML"]
        exclude: "^(tests/|migrations/|alembic/)"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-q", "-ll", "-r"]
        exclude: "^tests/"

  - repo: local
    hooks:
      - id: pytest-collect
        name: pytest --collect-only (compile check)
        entry: pytest --collect-only -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-coverage
        name: pytest with coverage (>= 80%)
        entry: bash -c 'pytest --cov --cov-report=xml --cov-branch --cov-fail-under=80 -q'
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: radon-complexity
        name: radon cyclomatic complexity (rank <= C)
        entry: bash -c 'radon cc src -n D -s | (! grep -E "^\s+.*\([0-9]+\)")'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: xenon-cognitive
        name: xenon cognitive complexity (max-absolute B)
        entry: bash -c 'command -v xenon >/dev/null && xenon --max-absolute B --max-modules A --max-average A src || exit 0'
        language: system
        pass_filenames: false
        stages: [pre-push]
# TypeScript pre-commit bundle. Append to common.yaml's repos: list.
  - repo: local
    hooks:
      - id: eslint-with-sonarjs
        name: eslint (incl. eslint-plugin-sonarjs cognitive-complexity)
        entry: bash -c 'if [ -f node_modules/.bin/eslint ]; then ./node_modules/.bin/eslint --max-warnings=0 --fix "$@"; elif [ -f biome.json ]; then npx biome check --apply "$@"; fi' --
        language: system
        types_or: [ts, tsx, javascript, jsx]

      - id: prettier
        name: prettier
        entry: bash -c 'if [ -f node_modules/.bin/prettier ]; then ./node_modules/.bin/prettier --write "$@"; fi' --
        language: system
        types_or: [ts, tsx, javascript, jsx, json, yaml, markdown]

      - id: tsc-noEmit
        name: tsc --noEmit
        entry: bash -c 'if [ -f tsconfig.json ]; then npx --yes tsc --noEmit -p tsconfig.json; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: vitest-changed
        name: vitest run with coverage on changed files
        entry: bash -c 'PM=$(command -v pnpm >/dev/null && echo pnpm || echo npm); grep -q "\"test\"" package.json && $PM run test -- --coverage --run --changed origin/main || true'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: npm-audit
        name: npm audit (high+)
        entry: bash -c 'PM=$(command -v pnpm >/dev/null && echo pnpm || echo npm); $PM audit --audit-level=high'
        language: system
        pass_filenames: false
        stages: [pre-push]
